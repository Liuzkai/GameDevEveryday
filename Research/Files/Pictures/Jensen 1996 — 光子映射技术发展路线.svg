<svg viewBox="0 0 680 1038" width="680" height="1038" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>光子映射技术发展路线与表示分岔</title>
  <desc>从 Radiosity、渲染方程和辐照度缓存等平行路线开始，展示光源侧追踪、粒子输运、光子图、Instant Radiosity、参与介质、渐进光子映射、SPPM 与 VCM 的发展关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="1038" fill="#FFFFFF"/>
  <text x="40" y="34" fill="#26215C" font-family="sans-serif" font-size="15" font-weight="500">从“存答案”到“存证据”，再到统一光传输</text>
  <text x="40" y="58" fill="#5F5E5A" font-family="sans-serif" font-size="12">光子映射技术谱系｜纵向为主线继承，横向为表示与用途分岔</text>

  <text x="40" y="92" fill="#444441" font-family="sans-serif" font-size="14" font-weight="500">平行路线与理论容器</text>

  <rect x="40" y="110" width="180" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="54" y="130" fill="#085041" font-family="sans-serif" font-size="12">1984　Goral</text>
  <text x="54" y="151" fill="#085041" font-family="sans-serif" font-size="13" font-weight="500">Radiosity</text>
  <text x="54" y="173" fill="#0F6E56" font-family="sans-serif" font-size="12">面间换能矩阵｜存答案</text>

  <rect x="250" y="110" width="180" height="78" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="264" y="130" fill="#444441" font-family="sans-serif" font-size="12">1986　Kajiya</text>
  <text x="264" y="151" fill="#2C2C2A" font-family="sans-serif" font-size="13" font-weight="500">Rendering Equation</text>
  <text x="264" y="173" fill="#5F5E5A" font-family="sans-serif" font-size="12">积分方程｜数学容器</text>

  <rect x="460" y="110" width="180" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="474" y="130" fill="#085041" font-family="sans-serif" font-size="12">1988　Ward</text>
  <text x="474" y="151" fill="#085041" font-family="sans-serif" font-size="13" font-weight="500">Irradiance caching</text>
  <text x="474" y="173" fill="#0F6E56" font-family="sans-serif" font-size="12">表面辐照度｜存答案</text>

  <text x="340" y="212" text-anchor="middle" fill="#5F5E5A" font-family="sans-serif" font-size="12">Kajiya 统一问题表达；Goral 与 Ward 不代表光子图的旧版本</text>

  <text x="40" y="244" fill="#3C3489" font-family="sans-serif" font-size="14" font-weight="500">光源侧粒子路线：把光传输存成可复用的“证据”</text>

  <rect x="200" y="264" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="284" fill="#534AB7" font-family="sans-serif" font-size="12">1986　Arvo</text>
  <text x="216" y="305" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">Backward ray tracing</text>
  <text x="216" y="324" fill="#534AB7" font-family="sans-serif" font-size="12">从光源侧走｜概念提出</text>

  <path d="M340 332V342" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="348" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="368" fill="#534AB7" font-family="sans-serif" font-size="12">1990　Arvo &amp; Kirk</text>
  <text x="216" y="389" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">Particle transport</text>
  <text x="216" y="408" fill="#534AB7" font-family="sans-serif" font-size="12">光子作为粒子输运｜方法雏形</text>

  <path d="M340 416V426" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="432" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="452" fill="#534AB7" font-family="sans-serif" font-size="12">1995　Jensen &amp; Christensen</text>
  <text x="216" y="473" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">Photon map 初版</text>
  <text x="216" y="492" fill="#534AB7" font-family="sans-serif" font-size="12">粒子记录 → 可查询的光子点集</text>

  <path d="M340 500V510" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="516" width="280" height="80" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="536" fill="#3C3489" font-family="sans-serif" font-size="12">★ 1996　Jensen</text>
  <text x="216" y="557" fill="#26215C" font-family="sans-serif" font-size="13" font-weight="500">Global Illumination using Photon Maps</text>
  <text x="216" y="576" fill="#3C3489" font-family="sans-serif" font-size="12">两张光子图＋shadow photon</text>
  <text x="216" y="591" fill="#534AB7" font-family="sans-serif" font-size="11">锥形滤波｜工程闭合</text>

  <path d="M480 546H494H504" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="516" width="130" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="522" y="536" fill="#0F6E56" font-family="sans-serif" font-size="11">1997　Keller</text>
  <text x="522" y="556" fill="#085041" font-family="sans-serif" font-size="12" font-weight="500">Instant Radiosity</text>
  <text x="522" y="577" fill="#085041" font-family="sans-serif" font-size="12">光子 → 虚拟点光源</text>
  <text x="522" y="595" fill="#0F6E56" font-family="sans-serif" font-size="11">换种问法，再次采样</text>

  <path d="M480 566H494V650H504" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="628" width="130" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="522" y="648" fill="#0F6E56" font-family="sans-serif" font-size="11">1998　Jensen &amp;</text>
  <text x="522" y="665" fill="#0F6E56" font-family="sans-serif" font-size="11">Christensen</text>
  <text x="522" y="685" fill="#085041" font-family="sans-serif" font-size="12" font-weight="500">参与介质光子图</text>
  <text x="522" y="705" fill="#0F6E56" font-family="sans-serif" font-size="11">表面点集 → 体积样本</text>

  <path d="M340 596V622" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="628" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="648" fill="#534AB7" font-family="sans-serif" font-size="12">2001　Jensen</text>
  <text x="216" y="669" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">光子映射专著</text>
  <text x="216" y="688" fill="#534AB7" font-family="sans-serif" font-size="12">方法系统化｜知识体系整合</text>

  <path d="M340 696V706" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="712" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="732" fill="#534AB7" font-family="sans-serif" font-size="12">2008　Hachisuka</text>
  <text x="216" y="753" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">Progressive Photon Mapping</text>
  <text x="216" y="772" fill="#534AB7" font-family="sans-serif" font-size="12">半径逐步收缩｜突破固定半径限制</text>

  <path d="M340 780V790" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="796" width="280" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="816" fill="#534AB7" font-family="sans-serif" font-size="12">2011　Hachisuka</text>
  <text x="216" y="837" fill="#3C3489" font-family="sans-serif" font-size="13" font-weight="500">SPPM</text>
  <text x="216" y="856" fill="#534AB7" font-family="sans-serif" font-size="12">随机渐进＋每像素半径</text>

  <path d="M340 864V874" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="880" width="280" height="68" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="216" y="900" fill="#534AB7" font-family="sans-serif" font-size="12">2013　Hachisuka</text>
  <text x="216" y="921" fill="#26215C" font-family="sans-serif" font-size="13" font-weight="500">VCM</text>
  <text x="216" y="940" fill="#3C3489" font-family="sans-serif" font-size="12">统一光子与路径的权重｜双向方法融合</text>

  <rect x="40" y="972" width="600" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="991" text-anchor="middle" fill="#444441" font-family="sans-serif" font-size="12" font-weight="500">核心差异不在“谁更新”，而在“留下什么”</text>
  <text x="340" y="1009" text-anchor="middle" fill="#5F5E5A" font-family="sans-serif" font-size="11">矩阵／辐照度＝答案　｜　光子点集＝证据　｜　VPL＝光源　｜　VCM＝统一估计框架</text>
</svg>
