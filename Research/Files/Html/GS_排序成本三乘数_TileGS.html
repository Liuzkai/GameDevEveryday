<desc>数量乘三百、每像素叠几十层、顺序锁死无法提前剔除，TileGS 用 tile 内分桶化解</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

<text x="135" y="80" text-anchor="middle" style="font:500 14px var(--font-sans); fill:#993C1D">数量 ×300</text>
<text x="135" y="104" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#712B13">你的 S 级爆发技</text>

<text x="350" y="122" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#633806">一个像素被几十个</text>

<text x="565" y="122" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#791F1F">early-z 全部失效</text>
