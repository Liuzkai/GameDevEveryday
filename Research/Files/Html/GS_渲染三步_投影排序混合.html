<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>3DGS 渲染：投影、排序、混合</title>
<desc>3D 椭球拍扁成屏幕上的 2D 椭圆，按深度排序后 alpha 混合成最终像素</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="125" y="52" text-anchor="middle" style="font:500 14px var(--font-sans); fill:#3C3489">① 3D 场景</text>
<text x="125" y="68" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#534AB7">几十万个高斯椭球</text>
<rect x="40" y="80" width="170" height="180" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<ellipse cx="95" cy="135" rx="34" ry="15" transform="rotate(-18 95 135)" fill="#AFA9EC"/>
<ellipse cx="145" cy="175" rx="40" ry="17" transform="rotate(14 145 175)" fill="#7F77DD"/>
<ellipse cx="100" cy="215" rx="26" ry="12" transform="rotate(38 100 215)" fill="#CECBF6"/>
<ellipse cx="160" cy="115" rx="22" ry="10" transform="rotate(-32 160 115)" fill="#534AB7"/>
<line x1="215" y1="170" x2="255" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="52" text-anchor="middle" style="font:500 14px var(--font-sans); fill:#0C447C">② 投影（splat）</text>
<text x="340" y="68" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#185FA5">每个椭球拍扁成 2D 椭圆</text>
<rect x="255" y="80" width="170" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="280" y="100" width="120" height="140" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
<ellipse cx="325" cy="155" rx="36" ry="19" fill="#1D9E75" opacity="0.5"/>
<ellipse cx="352" cy="178" rx="30" ry="16" fill="#D85A30" opacity="0.5"/>
<ellipse cx="330" cy="200" rx="24" ry="13" fill="#7F77DD" opacity="0.5"/>
<line x1="430" y1="170" x2="470" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="555" y="52" text-anchor="middle" style="font:500 14px var(--font-sans); fill:#633806">③ 排序 + 混合</text>
<text x="555" y="68" text-anchor="middle" style="font:400 12px var(--font-sans); fill:#854F0B">从远到近逐层叠色</text>
<rect x="470" y="80" width="170" height="180" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<rect x="488" y="105" width="90" height="42" rx="6" fill="#7F77DD" opacity="0.45"/>
<rect x="500" y="122" width="90" height="42" rx="6" fill="#D85A30" opacity="0.45"/>
<rect x="512" y="139" width="90" height="42" rx="6" fill="#1D9E75" opacity="0.45"/>
<text x="612" y="120" style="font:400 12px var(--font-sans); fill:#854F0B">远</text>
<text x="612" y="176" style="font:400 12px var(--font-sans); fill:#854F0B">近</text>
<line x1="555" y1="195" x2="555" y2="218" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="488" y="224" width="26" height="26" rx="4" fill="#534AB7"/>
<rect x="518" y="224" width="26" height="26" rx="4" fill="#993C1D"/>
<rect x="548" y="224" width="26" height="26" rx="4" fill="#BA7517"/>
<rect x="578" y="224" width="26" height="26" rx="4" fill="#0F6E56"/>
<rect x="608" y="224" width="26" height="26" rx="4" fill="#185FA5"/>
<text x="340" y="290" text-anchor="middle" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">拍扁也是矩阵乘法：Σ′ = J·W·Σ·Wᵀ·Jᵀ（3D 协方差 → 屏幕上的 2D 协方差）</text>
<text x="340" y="308" text-anchor="middle" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">J 是投影变换、W 是相机旋转——视角一变，每个椭圆的形状跟着变</text>
</svg>
