<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>前向、延迟与 3DGS 管线对比</title>
<desc>前向和延迟都假设每像素一个表面，3DGS 每像素是 N 层叠色，G-buffer 无处存放</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="60" y="86" style="font:500 14px var(--font-sans); fill:var(--color-text-primary)">前向</text>
<text x="52" y="102" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">不透明</text>
<rect x="130" y="64" width="130" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="195" y="86" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">几何 pass</text>
<line x1="266" y1="86" x2="296" y2="86" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="302" y="64" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="377" y="86" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">z-test 留最近</text>
<line x1="458" y1="86" x2="488" y2="86" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="494" y="64" width="130" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="559" y="86" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">逐像素着色</text>
<text x="60" y="178" style="font:500 14px var(--font-sans); fill:var(--color-text-primary)">延迟</text>
<text x="52" y="194" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">deferred</text>
<rect x="130" y="148" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="195" y="176" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">几何 pass</text>
<line x1="266" y1="176" x2="296" y2="176" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="302" y="148" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="392" y="168" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#633806">G-buffer</text>
<text x="392" y="188" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#854F0B">每像素只存 1 个表面</text>
<line x1="488" y1="176" x2="518" y2="176" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="524" y="148" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="574" y="176" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">统一光照</text>
<text x="60" y="272" style="font:500 14px var(--font-sans); fill:var(--color-text-primary)">3DGS</text>
<rect x="130" y="232" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="252" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#712B13">投影成 2D 椭圆</text>
<text x="200" y="272" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#993C1D">没有"表面"</text>
<line x1="276" y1="260" x2="306" y2="260" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="312" y="232" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="382" y="252" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#712B13">全局深度排序</text>
<text x="382" y="272" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#993C1D">每帧百万级</text>
<line x1="458" y1="260" x2="488" y2="260" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="494" y="232" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="559" y="252" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#712B13">按序 blend</text>
<text x="559" y="272" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#993C1D">每像素 N 层</text>
<text x="340" y="316" text-anchor="middle" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">冲突点（黄框）：G-buffer 假设「每像素只有 1 个表面」，GS 每像素是几十层雾 —— 存不下</text>
</svg>
