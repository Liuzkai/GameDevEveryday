<svg viewBox="0 0 680 310" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Learned Motion Matching 结构对照</title>
<desc>经典 Motion Matching 的三个阶段与 Learned Motion Matching 三个神经网络的逐一替换关系，以及内存占用对比</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="60" y="30" style="font:500 13px var(--font-sans); fill:var(--color-text-primary)">经典 Motion Matching（§3）</text>
<text x="60" y="46" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">内存随数据量线性增长：必须存 X（特征库）+ Y（动画库）</text>

<rect x="60" y="60" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="80" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">Projection 检索</text>
<text x="145" y="98" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#185FA5">在 X 中做最近邻搜索</text>

<rect x="255" y="60" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">Stepping 步进</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#185FA5">索引 i+1，逐帧查表</text>

<rect x="450" y="60" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="535" y="80" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#0C447C">Decompression 取姿态</text>
<text x="535" y="98" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#185FA5">查 Y 得姿态向量 y</text>

<line x1="230" y1="88" x2="250" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="88" x2="445" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="145" y1="116" x2="145" y2="168" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="340" y1="116" x2="340" y2="168" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="535" y1="116" x2="535" y2="168" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<text x="155" y="146" style="font:400 12px var(--font-sans); fill:#0F6E56">逐一替换（§4）</text>

<text x="60" y="186" style="font:500 13px var(--font-sans); fill:var(--color-text-primary)">Learned Motion Matching（§4）</text>
<text x="60" y="202" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">只存网络权重：内存恒定，与数据量解耦</text>

<rect x="60" y="216" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="236" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#085041">Projector P</text>
<text x="145" y="254" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#0F6E56">x̂ → (x*, z*) 仿真最近邻</text>

<rect x="255" y="216" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#085041">Stepper S</text>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#0F6E56">(x, z) → 下一帧增量 Δ</text>

<rect x="450" y="216" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="236" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans); fill:#085041">Decompressor D</text>
<text x="535" y="254" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans); fill:#0F6E56">(x, z) → 姿态 y</text>

<line x1="230" y1="244" x2="250" y2="244" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="244" x2="445" y2="244" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="60" y="298" style="font:400 12px var(--font-sans); fill:var(--color-text-secondary)">内存（Bear 场景，Table 3）：MM 995.6 MB → LMM 7.1 MB（约 140×）；代价：帧耗时 94 µs → 340 µs（CPU 单线程）</text>
</svg>
